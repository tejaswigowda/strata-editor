<head>
<meta charset="utf-8">
<title>Strata — call card</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
	/about/callcard — the living end-card every Strata short embeds.

	Vertical/portrait, centered layout by design: shorts render in a 9:16-ish
	frame, so this card is authored for that shape (not a landscape card
	cropped down). Single source, no build step, zero third-party network
	calls (no CDN, no fonts, no analytics; the QR is a pre-baked inline
	data-URI SVG with explicit width/height -- not a live generator, not a
	third-party QR API, and not just a viewBox, which some rasterizers
	silently fail to size). Visiting this page directly always shows the
	CURRENT card ("living"). A render bakes a snapshot of exactly this page
	at render time (see docs/editor/js/Callcard.js), so a rendered short
	freezes whatever this page said the day it was rendered, stamped with
	the version below.

	Keep this page visually self-contained: it is designed to be rasterized
	at a fixed pixel box (whatever size the embedding <canvas> plane asks
	for), not just viewed in a full browser window.
-->
<style>
	:root {
		color-scheme: dark;
	}
	html, body {
		margin: 0;
		padding: 0;
		width: 100%;
		height: 100%;
		background: #14161a;
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
	}
	.card {
		box-sizing: border-box;
		width: 100%;
		height: 100%;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		gap: 4vh;
		padding: 8vh 8vw;
		text-align: center;
		background:
			radial-gradient(circle at 50% 20%, rgba(110, 168, 255, 0.16), transparent 55%),
			linear-gradient(180deg, #14161a 0%, #1b1e24 100%);
	}
	.text {
		display: flex;
		flex-direction: column;
		gap: 2vh;
	}
	.tagline {
		margin: 0;
		color: #f3f5f8;
		font-size: clamp(22px, 6.4vw, 52px);
		font-weight: 700;
		line-height: 1.2;
		letter-spacing: -0.01em;
	}
	.mark {
		margin: 0;
		color: #9aa4b2;
		font-size: clamp(13px, 2.6vw, 24px);
		font-weight: 400;
		line-height: 1.4;
	}
	.mark strong {
		color: #d9dde3;
		font-weight: 600;
	}
	.qr-block {
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 1.6vh;
	}
	.qr-block img {
		display: block;
		width: clamp(120px, 30vw, 260px);
		height: clamp(120px, 30vw, 260px);
		background: #ffffff10;
		border-radius: 14px;
		padding: 12px;
		box-sizing: border-box;
	}
	.qr-caption {
		margin: 0;
		color: #7d8794;
		font-size: clamp(11px, 2vw, 16px);
		text-align: center;
	}
	.stamp {
		position: absolute;
		left: 50%;
		bottom: 1.6vh;
		transform: translateX(-50%);
		color: #5b6470;
		font-size: clamp(10px, 1.6vw, 14px);
		letter-spacing: 0.02em;
		font-variant-numeric: tabular-nums;
	}
</style>
</head>
