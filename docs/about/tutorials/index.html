<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tutorials — Strata</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Step-by-step Strata tutorials, by hand with no AI required: scenes and games, animation and rendering, characters, and motion capture.">
<!--
	/about/tutorials — index of step-by-step tutorials. Static, no build
	step, same-origin only. The list is NOT written here: it is rendered from
	tutorials.json (the same file the welcome page reads), so adding a tutorial
	is one entry there plus its thumbnail:
	  { title, href, group, blurb, desc, thumb, embed?, hidden? }
	  group  one of GROUPS below (an unknown group lands under "More")
	  blurb  one short sentence for the card; desc is the long form
	  thumb  640x400 JPEG under screenshots/thumbs/
	  embed  optional editor hash for an "Open example" link
	  href   a page in this folder, or an https:// URL (shown with its host and an arrow)
	  hidden true keeps a staged entry out of this page and the welcome page until it is switched on
	`node scripts/tutorial-policy.cjs lint` checks every entry, and that every page includes ../brand.js (the Strata icon).
-->
<style>
	:root { color-scheme: dark; }
	html, body {
		margin: 0;
		background: #14161a;
		color: #d9dde3;
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
		line-height: 1.6;
	}
	main {
		max-width: 1080px;
		margin: 0 auto;
		padding: 8vh 24px 12vh;
	}
	h1 {
		margin: 0 0 0.2em;
		font-size: 2rem;
		font-weight: 700;
		color: #f3f5f8;
	}
	.tagline {
		margin: 0 0 1.4em;
		color: #9aa4b2;
		font-size: 1.05rem;
		max-width: 640px;
	}
	a { color: #7db2ff; text-decoration: none; }
	a:hover { text-decoration: underline; }

	.jump { display: flex; flex-wrap: wrap; gap: 0.5em; margin: 0 0 0.5em; }
	.jump a {
		background: #1a1d23;
		border: 1px solid #2a2e36;
		border-radius: 999px;
		padding: 0.25em 0.9em;
		font-size: 0.88rem;
		color: #c3c9d1;
	}
	.jump a:hover { border-color: #3a4152; color: #f3f5f8; text-decoration: none; }
	.jump .n { color: #7d8794; margin-left: 0.35em; font-variant-numeric: tabular-nums; }

	section { margin-top: 2.6em; }
	section h2 {
		margin: 0 0 0.15em;
		font-size: 1.25rem;
		color: #f3f5f8;
		scroll-margin-top: 1.5em;
	}
	section .note { margin: 0 0 1.1em; color: #7d8794; font-size: 0.92rem; }

	.grid {
		display: grid;
		grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
		gap: 20px;
	}
	.card {
		position: relative;
		display: flex;
		flex-direction: column;
		background: #1a1d23;
		border: 1px solid #2a2e36;
		border-radius: 10px;
		overflow: hidden;
		transition: border-color 0.15s, transform 0.15s;
	}
	.card:hover, .card:focus-within { border-color: #3d5a8a; transform: translateY(-2px); }
	.card .thumb { display: block; aspect-ratio: 16 / 10; background: #0f1114; border-bottom: 1px solid #2a2e36; }
	.card .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
	.card .body { display: flex; flex-direction: column; gap: 0.35em; padding: 0.85em 1em 1em; flex: 1; }
	.card h3 { margin: 0; font-size: 1.02rem; line-height: 1.35; color: #f3f5f8; }
	.card h3 a { color: inherit; }
	.card h3 a:hover { text-decoration: none; color: #7db2ff; }
	/* the title link covers the whole card, so the card is one big click target */
	.card h3 a::after { content: ""; position: absolute; inset: 0; }
	.card p { margin: 0; color: #9aa4b2; font-size: 0.88rem; line-height: 1.5; }
	.card .try {
		position: relative; z-index: 1; align-self: flex-start;
		margin-top: auto; padding-top: 0.5em;
		font-size: 0.84rem;
	}
	.card .ext { margin-top: auto; padding-top: 0.5em; font-size: 0.8rem; color: #7d8794; }

	.status { color: #9aa4b2; }
	footer {
		margin-top: 3.5em;
		padding-top: 1.2em;
		border-top: 1px solid #2a2e36;
		color: #5b6470;
		font-size: 0.85rem;
	}
</style>
<script src="../brand.js" defer></script>
</head>
<body>
<main>
	<h1>Tutorials</h1>
	<p class="tagline">Step-by-step walkthroughs for building scenes, games, animation and characters with Strata — by hand, no AI required. <span id="count"></span></p>

	<nav class="jump" id="jump" aria-label="Sections"></nav>

	<div id="list"><p class="status">Loading tutorials…</p></div>
	<noscript><p class="status">This page lists the tutorials from <a href="tutorials.json">tutorials.json</a> using a little JavaScript. With scripting off, open that file, or go <a href="../">back to about</a>.</p></noscript>

	<footer>
		<a href="../">← Back to about</a>
	</footer>
</main>
<script>
( function () {

	// Section order and a one-line note for each. Unknown groups are listed last, under "More".
	const GROUPS = [
		{ name: 'Scenes and games', note: 'Build a scene, label it, and leave the behaviour to game code.' },
		{ name: 'Animation and rendering', note: 'Timelines, cameras and shots.' },
		{ name: 'Characters', note: 'Import, restyle, pose and animate a character.' },
		{ name: 'Motion capture', note: 'Work from recorded performances.' },
		{ name: 'Strata Play', note: 'The player: run, fork and wire up the games you build here.' },
	];

	const list = document.getElementById( 'list' );
	const jump = document.getElementById( 'jump' );

	const slug = ( s ) => s.toLowerCase().replace( /[^a-z0-9]+/g, '-' ).replace( /^-|-$/g, '' );

	function card( t ) {

		const el = document.createElement( 'article' );
		el.className = 'card';

		if ( t.thumb ) {

			const thumb = document.createElement( 'a' );
			thumb.className = 'thumb';
			thumb.href = t.href;
			thumb.tabIndex = - 1;
			thumb.setAttribute( 'aria-hidden', 'true' );
			const img = document.createElement( 'img' );
			img.src = t.thumb;
			img.alt = '';
			img.width = 640;
			img.height = 400;
			img.loading = 'lazy';
			thumb.appendChild( img );
			el.appendChild( thumb );

		}

		const body = document.createElement( 'div' );
		body.className = 'body';

		const h = document.createElement( 'h3' );
		const a = document.createElement( 'a' );
		a.href = t.href;
		a.textContent = t.title;
		h.appendChild( a );
		body.appendChild( h );

		const p = document.createElement( 'p' );
		p.textContent = t.blurb || t.desc;
		body.appendChild( p );

		if ( /^https?:\/\//.test( t.href ) ) {

			const ext = document.createElement( 'span' );
			ext.className = 'ext';
			ext.textContent = new URL( t.href ).hostname + ' ↗';
			body.appendChild( ext );

		}

		if ( t.embed ) {

			const open = document.createElement( 'a' );
			open.className = 'try';
			open.href = '../../' + t.embed;
			open.textContent = 'Open example →';
			open.title = 'Open the finished scene in the editor';
			body.appendChild( open );

		}

		el.appendChild( body );
		return el;

	}

	function render( tutorials ) {

		tutorials = tutorials.filter( ( t ) => ! t.hidden );	// staged entries stay out until switched on

		const byGroup = new Map();
		for ( const t of tutorials ) {

			const known = GROUPS.some( ( g ) => g.name === t.group );
			const key = known ? t.group : 'More';
			if ( ! byGroup.has( key ) ) byGroup.set( key, [] );
			byGroup.get( key ).push( t );

		}

		const order = GROUPS.map( ( g ) => g.name ).concat( 'More' ).filter( ( n ) => byGroup.has( n ) );
		list.innerHTML = '';
		jump.innerHTML = '';

		for ( const name of order ) {

			const items = byGroup.get( name );
			const note = ( GROUPS.find( ( g ) => g.name === name ) || {} ).note;

			const nav = document.createElement( 'a' );
			nav.href = '#' + slug( name );
			nav.textContent = name;
			const n = document.createElement( 'span' );
			n.className = 'n';
			n.textContent = items.length;
			nav.appendChild( n );
			jump.appendChild( nav );

			const section = document.createElement( 'section' );
			const h2 = document.createElement( 'h2' );
			h2.id = slug( name );
			h2.textContent = name;
			section.appendChild( h2 );
			if ( note ) {

				const np = document.createElement( 'p' );
				np.className = 'note';
				np.textContent = note;
				section.appendChild( np );

			}

			const grid = document.createElement( 'div' );
			grid.className = 'grid';
			for ( const t of items ) grid.appendChild( card( t ) );
			section.appendChild( grid );
			list.appendChild( section );

		}

		document.getElementById( 'count' ).textContent = tutorials.length + ' tutorials.';

	}

	fetch( 'tutorials.json' )
		.then( ( r ) => r.ok ? r.json() : Promise.reject( new Error( 'HTTP ' + r.status ) ) )
		.then( render )
		.catch( ( e ) => { list.innerHTML = ''; const p = document.createElement( 'p' ); p.className = 'status'; p.textContent = 'Could not load tutorials.json (' + e.message + '). If you opened this file directly, serve the folder over http instead.'; list.appendChild( p ); } );

}() );
</script>
</body>
</html>
